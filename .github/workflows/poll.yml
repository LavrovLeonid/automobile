name: poll

# Опрос канала @hc_avtomobilist. Telegram Serverless не умеет запускать код по
# расписанию, а из его облака t.me недоступен. Поэтому cron живёт здесь:
# scripts/poll.js скачивает превью канала на раннере и через `tgcloud run`
# передаёт посты в endpoints/poll (исходники из этого коммита, деплой не нужен).
#
# Каждые 10 минут с 07:00 до 22:50 по Екатеринбургу (UTC+5), 96 запусков в день.
# Каждый запуск тарифицируется как минимум 1 минута, итого ~2900 минут Actions
# в месяц — больше бесплатных 2000 для приватного репо.
# GitHub может задерживать запуски по cron на 5–15 минут.
on:
  schedule:
    - cron: '*/10 2-17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только показать, что было бы переслано'
        type: boolean
        default: false

# Два опроса одновременно могли бы переслать один пост дважды.
concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Poll channel
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/poll.js --dry-run
          else
            node scripts/poll.js
          fi
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
